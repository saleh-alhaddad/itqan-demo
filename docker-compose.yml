services:
  db:
    image: postgres:18-alpine
    container_name: itqan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: itqan
      POSTGRES_PASSWORD: itqan
      POSTGRES_DB: itqan
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itqan -d itqan"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
